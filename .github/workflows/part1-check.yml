name: Part 1 - Validate Repository Structure

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  validate-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check /docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "ERROR: /docs folder is missing."
            exit 1
          fi
          echo "docs folder found."

      - name: Check ERD file exists (PNG or PDF)
        run: |
          if ! ls docs/*.png docs/*.pdf 2>/dev/null | grep -iE "erd" ; then
            echo "ERROR: No ERD file (containing 'erd' in the filename, .png or .pdf) found in /docs."
            exit 1
          fi
          echo "ERD file found."

      - name: Check API endpoint plan exists (PDF or Markdown)
        run: |
          if ! ls docs/*.pdf docs/*.md 2>/dev/null | grep -iE "endpoint" ; then
            echo "ERROR: No endpoint plan file (containing 'endpoint' in the filename, .pdf or .md) found in /docs."
            exit 1
          fi
          echo "Endpoint plan file found."

      - name: Check SQL script exists
        run: |
          if ! ls docs/*.sql 2>/dev/null ; then
            echo "ERROR: No .sql file found in /docs."
            exit 1
          fi
          echo "SQL script found."

      - name: Check README exists at repository root
        run: |
          if [ ! -f "README.md" ]; then
            echo "ERROR: README.md is missing from the repository root."
            exit 1
          fi
          echo "README.md found."

      - name: All checks passed
        run: echo "Repository structure meets Part 1 requirements."
