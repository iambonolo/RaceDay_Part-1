name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore packages
        run: dotnet restore Part2-API/RaceDay/RaceDay.sln

      - name: Build
        run: dotnet build Part2-API/RaceDay/RaceDay.sln --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test Part2-API/RaceDay/RaceDay.sln --no-build --configuration Release --verbosity normal
